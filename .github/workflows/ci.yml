name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        extras: ["core"]
        include:
          # The file-extraction channels are optional. Run one job with them
          # installed and one without, so a missing optional dependency can
          # never silently stop a channel from being exercised.
          - python-version: "3.13"
            extras: "files"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tesseract
        if: matrix.extras == 'files'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (core only)
        if: matrix.extras == 'core'
        run: uv pip install --system -e . pytest

      - name: Install (with file extraction)
        if: matrix.extras == 'files'
        run: uv pip install --system -e ".[files]" pytest

      - name: Run tests
        run: python -m pytest -q

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check metadata renders on PyPI
        run: |
          uv pip install --system twine
          twine check dist/*
