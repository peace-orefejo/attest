# Turn on auto-merge for Dependabot's patch and minor updates. GitHub then merges
# the pull request only after the required CI checks pass. Major updates are
# left open with a comment, for a person to review.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'peace-orefejo/attest'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update's metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge patch and minor updates once CI passes
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask for a review of major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major' && github.event.action == 'opened'
        run: |
          gh pr comment "$PR_URL" --body "This is a major version update, so it isn't merged automatically. Check the release notes for breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
