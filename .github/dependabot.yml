# Dependency updates: one grouped pull request a week per ecosystem.
# Patch and minor updates merge automatically once CI passes (see
# workflows/dependabot-auto-merge.yml); major updates wait for review.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      python-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
