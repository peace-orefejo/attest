[project]
name = "agent-attest"
version = "0.9.0"
description = "Evidence-grounded evaluator for AI agent runs: checks agent claims against the recorded tool outputs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Adepeju Orefejo", email = "adepejuorefejo5@gmail.com" }]
keywords = [
    "evals",
    "evaluation",
    "llm",
    "agents",
    "ai",
    "ai-agents",
    "agent-evaluation",
    "llm-evaluation",
    "ai-evaluation",
    "llm-as-a-judge",
    "hallucination-detection",
    "prompt-injection",
    "tool-calling",
    "faithfulness",
    "groundedness",
    "trajectory",
    "code-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=0.77,<2",
    "pydantic>=2.14.2",
    "typer>=0.27.3",
    "python-dotenv>=1.2.4",
    "instructor>=1.17.0,<2",
    "regex>=2026.9.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["instructor[google-genai]>=1.17.0"]
all = [
    "openai>=1.40",
    "instructor[google-genai]>=1.17.0",
    "defusedxml>=0.7.1",
    "pillow>=11.0",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "zxing-cpp>=2.3",
]
files = [
    "defusedxml>=0.7.1",
    "pillow>=11.0",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "zxing-cpp>=2.3",
]

[project.urls]
Homepage = "https://peace-orefejo.github.io/attest/"
Documentation = "https://peace-orefejo.github.io/attest/"
Repository = "https://github.com/peace-orefejo/attest"
Issues = "https://github.com/peace-orefejo/attest/issues"
Changelog = "https://peace-orefejo.github.io/attest/changelog/"

[project.scripts]
attest = "attest.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "hypothesis>=6.100",
    "instructor[google-genai]>=1.17.0",
    "defusedxml>=0.7.1",
    "pillow>=11.0",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "zxing-cpp>=2.3",
    "types-pyyaml>=6.0.12.20260906",
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

hf = ["huggingface_hub>=0.34"]

docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "griffe-pydantic>=1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attest"]
exclude = ["**/*_test.py", "**/conftest.py", "**/fixtures"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.claude", "/benchmarks"]

[tool.pytest.ini_options]
pythonpath = ["src", "benchmarks/runners", "benchmarks/converters"]
testpaths = ["src", "benchmarks"]
python_files = ["*_test.py"]
markers = [
    "integration: end-to-end tests that make real LLM calls (opt in with ATTEST_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "benchmarks/runners", "benchmarks/converters"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["–"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "attest.extraction.limits.ExtractionLimits", "attest.extraction.ExtractionLimits", "attest.ExtractionLimits"]

[tool.ruff.lint.per-file-ignores]
"src/attest/prompts/*" = ["E501"]

[tool.pyright]
include = ["src", "benchmarks"]
extraPaths = ["src", "benchmarks/runners", "benchmarks/converters"]
exclude = ["**/*_test.py", "**/conftest.py", "**/__pycache__", "benchmarks/private"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
