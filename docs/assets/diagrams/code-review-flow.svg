<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Code review mode</title>
  <desc id="d">Each reviewer output is turned into a run whose evidence is the diff, the changed-file list and file reads. Faithfulness and the code injection check feed a gate that keeps or drops the output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="319" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <g>
    <rect x="24" y="24" width="196" height="272" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="54" font-size="15" font-weight="700" fill="#0f172a">Reviewer outputs</text>
    <rect x="40" y="70" width="164" height="36" rx="8" fill="#e0e7ff"/>
    <text x="52" y="93" font-size="13" fill="#312e81">issue</text>
    <rect x="40" y="116" width="164" height="36" rx="8" fill="#e0e7ff"/>
    <text x="52" y="139" font-size="13" fill="#312e81">diff summary</text>
    <rect x="40" y="162" width="164" height="36" rx="8" fill="#e0e7ff"/>
    <text x="52" y="185" font-size="13" fill="#312e81">group summary</text>
    <rect x="40" y="208" width="164" height="36" rx="8" fill="#e0e7ff"/>
    <text x="52" y="231" font-size="13" fill="#312e81">canvas answer</text>
    <text x="40" y="274" font-size="12" fill="#64748b">ReviewOutput</text>
  </g>

  <line x1="224" y1="160" x2="256" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="260" y="24" width="200" height="272" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="276" y="54" font-size="15" font-weight="700" fill="#0f172a">Evidence</text>
    <text x="276" y="76" font-size="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">to_run(output)</text>
    <rect x="276" y="92" width="168" height="32" rx="8" fill="#dcfce7"/>
    <text x="288" y="113" font-size="12" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">read_diff</text>
    <rect x="276" y="132" width="168" height="32" rx="8" fill="#dcfce7"/>
    <text x="288" y="153" font-size="12" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">list_changed_files</text>
    <rect x="276" y="172" width="168" height="32" rx="8" fill="#dcfce7"/>
    <text x="288" y="193" font-size="12" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">read_file / grep</text>
    <text x="276" y="234" font-size="12" fill="#64748b">Lockfiles become version</text>
    <text x="276" y="252" font-size="12" fill="#64748b">changes; generated files</text>
    <text x="276" y="270" font-size="12" fill="#64748b">get a note, not the text.</text>
  </g>

  <path d="M464,160 C484,160 484,88 500,88" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M464,160 C484,160 484,232 500,232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="504" y="24" width="204" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="520" y="54" font-size="15" font-weight="700" fill="#0f172a">Faithfulness</text>
    <text x="520" y="76" font-size="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">answer_kind="code"</text>
    <text x="520" y="104" font-size="12" fill="#334155">Each claim in the output is</text>
    <text x="520" y="122" font-size="12" fill="#334155">checked against the diff and</text>
    <text x="520" y="140" font-size="12" fill="#334155">the source it read.</text>
  </g>

  <g>
    <rect x="504" y="168" width="204" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="520" y="198" font-size="15" font-weight="700" fill="#0f172a">Code injection</text>
    <text x="520" y="220" font-size="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">check_code_injection</text>
    <text x="520" y="248" font-size="12" fill="#334155">Finds instructions planted in</text>
    <text x="520" y="266" font-size="12" fill="#334155">the diff for the AI reviewer,</text>
    <text x="520" y="284" font-size="12" fill="#334155">and which outputs obeyed.</text>
  </g>

  <path d="M712,88 C728,88 728,160 740,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M712,232 C728,232 728,160 740,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="744" y="24" width="192" height="272" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="760" y="54" font-size="15" font-weight="700" fill="#0f172a">gate()</text>
    <rect x="760" y="70" width="160" height="40" rx="8" fill="#dcfce7"/>
    <text x="772" y="95" font-size="13" font-weight="700" fill="#15803d">KEEP</text>
    <text x="908" y="95" font-size="11" fill="#14532d" text-anchor="end">show it</text>
    <rect x="760" y="120" width="160" height="40" rx="8" fill="#fee2e2"/>
    <text x="772" y="145" font-size="13" font-weight="700" fill="#b91c1c">DROP</text>
    <text x="908" y="145" font-size="11" fill="#7f1d1d" text-anchor="end">with reasons</text>
    <text x="760" y="194" font-size="12" font-weight="600" fill="#334155">lenient</text>
    <text x="760" y="212" font-size="12" fill="#64748b">issues: drop if contradicted</text>
    <text x="760" y="240" font-size="12" font-weight="600" fill="#334155">strict</text>
    <text x="760" y="258" font-size="12" fill="#64748b">summaries, answers: also</text>
    <text x="760" y="276" font-size="12" fill="#64748b">drop if not shown</text>
  </g>
</svg>
