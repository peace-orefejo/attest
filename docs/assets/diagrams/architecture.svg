<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">attest package layers</title>
  <desc id="d">Entry points at the top, then display, then feature packages, with the shared foundation (data models, llm, prompts) and utils at the bottom. Imports only point downward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="475" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="24" y="40" font-size="12" font-weight="700" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1">ENTRY POINTS</text>
    <rect x="24" y="52" width="380" height="56" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="40" y="76" font-size="14" font-weight="700" fill="#312e81">api.py</text>
    <text x="40" y="96" font-size="12" fill="#3730a3">Attest(provider, model, policy)</text>
    <rect x="420" y="52" width="380" height="56" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="436" y="76" font-size="14" font-weight="700" fill="#312e81">cli/</text>
    <text x="436" y="96" font-size="12" fill="#3730a3">attest run | tools | injection | role | review</text>

    <text x="24" y="140" font-size="12" font-weight="700" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1">DISPLAY</text>
    <rect x="24" y="152" width="776" height="48" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="40" y="181" font-size="14" font-weight="700" fill="#78350f">display/</text>
    <text x="140" y="181" font-size="12" fill="#92400e">render, show: Report, CheckResult, ReviewResult, GateDecision</text>

    <text x="24" y="228" font-size="12" font-weight="700" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1">FEATURES</text>
    <rect x="24" y="240" width="184" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="38" y="264" font-size="14" font-weight="700" fill="#0f172a">checks/</text>
    <text x="38" y="284" font-size="11" fill="#475569">verify, tool_use, role</text>
    <text x="38" y="301" font-size="11" fill="#475569">injection/, profiles/</text>
    <rect x="220" y="240" width="184" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="234" y="264" font-size="14" font-weight="700" fill="#0f172a">code_review/</text>
    <text x="234" y="284" font-size="11" fill="#475569">adapter, detect</text>
    <text x="234" y="301" font-size="11" fill="#475569">evidence/, gate/</text>
    <text x="234" y="318" font-size="11" fill="#475569">guidelines/, injection/</text>
    <text x="234" y="335" font-size="11" fill="#475569">review/, writer/</text>
    <rect x="416" y="240" width="120" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="430" y="264" font-size="14" font-weight="700" fill="#0f172a">policy/</text>
    <text x="430" y="284" font-size="11" fill="#475569">rules, loading</text>
    <rect x="548" y="240" width="132" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="562" y="264" font-size="14" font-weight="700" fill="#0f172a">extraction/</text>
    <text x="562" y="284" font-size="11" fill="#475569">pdf, image,</text>
    <text x="562" y="301" font-size="11" fill="#475569">xml, csv, html</text>
    <rect x="692" y="240" width="108" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="706" y="264" font-size="14" font-weight="700" fill="#0f172a">scoring/</text>
    <text x="706" y="284" font-size="11" fill="#475569">report</text>
    <rect x="812" y="240" width="124" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="826" y="264" font-size="14" font-weight="700" fill="#0f172a">adapters/</text>
    <text x="826" y="284" font-size="11" fill="#475569">langgraph</text>

    <text x="24" y="384" font-size="12" font-weight="700" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1">FOUNDATION</text>
    <rect x="24" y="396" width="676" height="68" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="40" y="420" font-size="14" font-weight="700" fill="#14532d">models · llm/ · prompts/</text>
    <text x="40" y="442" font-size="12" fill="#166534">trajectory  results  content  providers  ·  llm/ (clients, calls, budget)  ·  prompts/</text>
    <rect x="712" y="396" width="224" height="68" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="728" y="420" font-size="14" font-weight="700" fill="#0f172a">utils/</text>
    <text x="728" y="439" font-size="12" fill="#475569">diff  unicode_scan</text>
    <text x="728" y="455" font-size="12" fill="#475569">encoded_scan</text>
  </g>
  <line x1="880" y1="60" x2="880" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="868" y="112" font-size="11" fill="#64748b" text-anchor="end">imports</text>
  <text x="868" y="128" font-size="11" fill="#64748b" text-anchor="end">point</text>
  <text x="868" y="144" font-size="11" fill="#64748b" text-anchor="end">down</text>
</svg>
